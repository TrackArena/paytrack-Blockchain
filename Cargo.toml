[workspace]
name = "paytrack-blockchain"
resolver = "2"

# Contracts will be added here as they are developed in Phase 7
# members = [
#     "contracts/escrow",
#     "contracts/milestone-release",
# ]

[workspace.dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
